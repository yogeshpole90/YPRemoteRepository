<!DOCTYPE html>
<html>
<head>
    <title>Test Evidence</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; max-width: 1100px; margin: 0 auto; padding: 20px; }
        .header { background: #1e3a5f; color: white; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; }
        .section { border: 1px solid #ddd; border-radius: 8px; margin: 20px 0; padding: 15px; }
        .section-title { font-size: 18px; font-weight: bold; color: #2c7da0; margin-bottom: 10px; border-bottom: 2px solid #2c7da0; padding-bottom: 5px; }
        .field { margin: 8px 0; }
        .field label { font-weight: bold; color: #333; min-width: 150px; display: inline-block; }
        .field span { color: #555; }
        .ss-box {
            border: 2px dashed #2c7da0;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin: 10px 0;
            background: #f9f9f9;
            cursor: pointer;
            position: relative;
        }
        .ss-box input[type="file"] {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
        }
        .ss-box img { max-width: 100%; border-radius: 6px; display: none; }
        .ss-box p { color: #888; margin: 0; }
        .add-section { background: #2c7da0; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; margin: 10px 5px; font-size: 14px; }
        .add-section:hover { background: #1a5d7a; }
    </style>
</head>
<body>

<div class="header">
    <h2 style="margin:0;">📋 Test Evidence Report</h2>
    <p style="margin:5px 0 0 0; font-size:13px;">Add screenshots and details below</p>
</div>

<div class="section">
    <div class="section-title">Test Info</div>
    <div class="field"><label>TS Number:</label> <span contenteditable="true">TS___</span></div>
    <div class="field"><label>Module:</label> <span contenteditable="true">Click to edit</span></div>
    <div class="field"><label>Screen:</label> <span contenteditable="true">Click to edit</span></div>
    <div class="field"><label>Date:</label> <span contenteditable="true">09-Jun-2026</span></div>
    <div class="field"><label>Tester:</label> <span contenteditable="true">Yogesh</span></div>
    <div class="field"><label>Status:</label> <span contenteditable="true">Pass / Fail</span></div>
</div>

<div id="sections-container">
    <div class="section">
        <div class="section-title" contenteditable="true">Step 1 - Description</div>
        <div class="field"><label>Expected:</label> <span contenteditable="true">Click to edit</span></div>
        <div class="field"><label>Actual:</label> <span contenteditable="true">Click to edit</span></div>
        <div class="ss-box" onclick="this.querySelector('input').click()">
            <input type="file" accept="image/*" onchange="loadImage(event, this)">
            <img src="" alt="screenshot">
            <p>📷 Click here to add Screenshot</p>
        </div>
    </div>
</div>

<button class="add-section" onclick="addSection()">+ Add Step</button>

<script>
    function loadImage(event, input) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const box = input.parentElement;
            const img = box.querySelector('img');
            const p = box.querySelector('p');
            img.src = e.target.result;
            img.style.display = 'block';
            p.style.display = 'none';
        };
        reader.readAsDataURL(file);
    }

    let count = 2;
    function addSection() {
        const container = document.getElementById('sections-container');
        const div = document.createElement('div');
        div.className = 'section';
        div.innerHTML = `
            <div class="section-title" contenteditable="true">Step ${count} - Description</div>
            <div class="field"><label>Expected:</label> <span contenteditable="true">Click to edit</span></div>
            <div class="field"><label>Actual:</label> <span contenteditable="true">Click to edit</span></div>
            <div class="ss-box" onclick="this.querySelector('input').click()">
                <input type="file" accept="image/*" onchange="loadImage(event, this)">
                <img src="" alt="screenshot" style="display:none; max-width:100%; border-radius:6px;">
                <p>📷 Click here to add Screenshot</p>
            </div>`;
        container.appendChild(div);
        count++;
    }
</script>

</body>
</html>
