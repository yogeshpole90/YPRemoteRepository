<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Daily Status Report - Timesheet</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,sans-serif;background:#f5f7fa;color:#333;padding:15px}
h1{text-align:center;color:#2c3e50;margin-bottom:15px;font-size:1.5em}
.tabs-nav{display:flex;gap:2px;margin-bottom:0}
.tabs-nav button{padding:10px 25px;border:none;border-radius:8px 8px 0 0;cursor:pointer;font-size:0.95em;font-weight:600;background:#e8ecf0;color:#666;border:1px solid #ddd;border-bottom:none}
.tabs-nav button.active{background:#fff;color:#2980b9;border-color:#ccc}
.page{display:none;background:#fff;border:1px solid #ddd;border-radius:0 8px 8px 8px;padding:20px}
.page.active{display:block}
.form-section{margin-bottom:15px}
.form-section h3{color:#2980b9;margin-bottom:10px;font-size:1em}
.row{display:flex;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;flex:1;min-width:150px}
.field label{font-size:0.75em;color:#666;margin-bottom:3px}
.field input,.field textarea{padding:7px 10px;border-radius:5px;border:1px solid #ccc;background:#fff;color:#333;font-size:0.85em}
.field textarea{resize:vertical;min-height:50px}
.btn{padding:8px 18px;border:none;border-radius:6px;cursor:pointer;font-size:0.85em;font-weight:600;transition:0.2s}
.btn-add{background:#27ae60;color:#fff}
.btn-add:hover{background:#219a52}
.btn-clear{background:#e74c3c;color:#fff}
.btn-clear:hover{background:#c0392b}
.btn-copy{background:#f39c12;color:#fff}
.btn-copy:hover{background:#d68910}
.btn-export{background:#8e44ad;color:#fff}
.btn-export:hover{background:#7d3c98}
.btn-delete-row{background:#e74c3c;color:#fff;padding:3px 8px;font-size:0.75em;border:none;border-radius:4px;cursor:pointer}
.btn-teams{background:#5b5fc7;color:#fff}
.btn-teams:hover{background:#4a4eb5}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}

/* Excel-like table */
.table-wrapper{overflow-x:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:0.8em}
th{background:#2980b9;color:#fff;padding:8px 6px;border:1px solid #2471a3;text-align:left;white-space:nowrap}
td{padding:6px;border:1px solid #ddd;background:#fff;color:#333}
tr:hover td{background:#eaf2f8}
.sr-col{width:40px;text-align:center}
.empty-msg{text-align:center;padding:30px;color:#999;font-style:italic}
.stats{display:flex;gap:20px;margin-top:12px;padding:10px;background:#eaf2f8;border-radius:6px;font-size:0.85em}
.stats span{color:#2980b9;font-weight:600}
.teams-output{background:#f8f9fa;border:1px solid #ddd;border-radius:6px;padding:12px;margin-top:10px;white-space:pre-wrap;font-family:Consolas,monospace;font-size:0.82em;max-height:300px;overflow-y:auto;display:none;color:#333}
</style>
</head>
<body>

<h1>📋 Daily Status Report / Timesheet</h1>

<div class="tabs-nav">
<button class="active" onclick="switchPage('add')">➕ Add Entry</button>
<button onclick="switchPage('view')">📊 View Timesheet</button>
</div>

<!-- PAGE 1: Add Entry -->
<div class="page active" id="pageAdd">
<div class="form-section">
<h3>📌 Add New Entry</h3>
<div class="row">
<div class="field">
<label>Project Name</label>
<input type="text" id="fProject" value="AGAT Credit LOS">
</div>
<div class="field">
<label>Resource Name</label>
<input type="text" id="fResource" value="Yogesh Pole">
</div>
</div>
<div class="row">
<div class="field">
<label>Task Name</label>
<input type="text" id="fTask" placeholder="e.g., Offer Acceptance - Repayment Schedule Testing">
</div>
</div>
<div class="row">
<div class="field">
<label>Start Date</label>
<input type="date" id="fStartDate">
</div>
<div class="field">
<label>End Date</label>
<input type="date" id="fEndDate">
</div>
<div class="field">
<label>Daily Working Hours</label>
<input type="number" id="fHours" value="8" min="0.5" max="12" step="0.5">
</div>
</div>
<div class="row">
<div class="field">
<label>Remarks</label>
<input type="text" id="fRemarks" placeholder="Optional remarks...">
</div>
</div>
<div class="actions">
<button class="btn btn-add" onclick="addEntry()">✅ Add Entry</button>
<button class="btn btn-clear" onclick="clearForm()">🗑️ Clear Form</button>
</div>
</div>

<!-- Quick Add Multiple -->
<div class="form-section" style="margin-top:15px">
<h3>⚡ Recent Entries Added</h3>
<div id="recentEntries" class="empty-msg">No entries added yet today.</div>
</div>
</div>

<!-- PAGE 2: View Timesheet -->
<div class="page" id="pageView">
<div class="form-section">
<h3>📊 Timesheet Entries</h3>
<div class="row">
<div class="field" style="max-width:200px">
<label>Filter by Date</label>
<input type="date" id="filterDate" onchange="renderTable()">
</div>
<div class="field" style="max-width:200px">
<label>Filter by Task</label>
<input type="text" id="filterTask" placeholder="Search task..." oninput="renderTable()">
</div>
<div class="field" style="flex:0;align-self:flex-end">
<button class="btn btn-clear" onclick="clearFilter()">Clear Filter</button>
</div>
</div>
</div>

<div class="table-wrapper">
<table>
<thead>
<tr>
<th class="sr-col">Sr.</th>
<th>Project Name</th>
<th>Resource Name</th>
<th>Task Name</th>
<th>Start Date</th>
<th>End Date</th>
<th>Hours</th>
<th>Remarks</th>
<th>Delete</th>
</tr>
</thead>
<tbody id="tableBody">
</tbody>
</table>
</div>
<div id="emptyTable" class="empty-msg">No entries found.</div>

<div class="stats">
<div>Total Entries: <span id="statEntries">0</span></div>
<div>Total Hours: <span id="statHours">0</span></div>
</div>

<div class="actions">
<button class="btn btn-copy" onclick="copyAsExcel()">📋 Copy for Excel</button>
<button class="btn btn-teams" onclick="toggleTeams()">💬 Teams Format</button>
<button class="btn btn-export" onclick="exportExcel()">💾 Export as CSV</button>
<button class="btn btn-clear" onclick="clearAll()">🗑️ Clear All Data</button>
</div>

<div class="teams-output" id="teamsBox"></div>
</div>

<script>
let entries = JSON.parse(localStorage.getItem('timesheet_entries') || '[]');

// Set today's date
const today = new Date().toISOString().split('T')[0];
document.getElementById('fStartDate').value = today;
document.getElementById('fEndDate').value = today;

// Initial render
renderRecent();
renderTable();

function switchPage(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tabs-nav button').forEach(b => b.classList.remove('active'));
    if(page === 'add') {
        document.getElementById('pageAdd').classList.add('active');
        document.querySelectorAll('.tabs-nav button')[0].classList.add('active');
    } else {
        document.getElementById('pageView').classList.add('active');
        document.querySelectorAll('.tabs-nav button')[1].classList.add('active');
        renderTable();
    }
}

function addEntry() {
    const project = document.getElementById('fProject').value.trim();
    const resource = document.getElementById('fResource').value.trim();
    const task = document.getElementById('fTask').value.trim();
    const startDate = document.getElementById('fStartDate').value;
    const endDate = document.getElementById('fEndDate').value;
    const hours = document.getElementById('fHours').value;
    const remarks = document.getElementById('fRemarks').value.trim();

    if(!task) { alert('Task Name is required!'); return; }
    if(!startDate) { alert('Start Date is required!'); return; }

    entries.push({project, resource, task, startDate, endDate: endDate||startDate, hours, remarks, id: Date.now()});
    saveEntries();
    renderRecent();
    
    // Clear task & remarks for next entry
    document.getElementById('fTask').value = '';
    document.getElementById('fRemarks').value = '';
    document.getElementById('fTask').focus();
}

function deleteEntry(id) {
    entries = entries.filter(e => e.id !== id);
    saveEntries();
    renderRecent();
    renderTable();
}

function clearForm() {
    document.getElementById('fTask').value = '';
    document.getElementById('fRemarks').value = '';
    document.getElementById('fHours').value = '8';
    document.getElementById('fStartDate').value = today;
    document.getElementById('fEndDate').value = today;
}

function saveEntries() {
    localStorage.setItem('timesheet_entries', JSON.stringify(entries));
}

function formatDate(dateStr) {
    if(!dateStr) return '';
    const d = new Date(dateStr);
    const day = String(d.getDate()).padStart(2,'0');
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${day}-${months[d.getMonth()]}-${String(d.getFullYear()).slice(-2)}`;
}

function renderRecent() {
    const todayEntries = entries.filter(e => e.startDate === today);
    const div = document.getElementById('recentEntries');
    if(todayEntries.length === 0) {
        div.innerHTML = '<div class="empty-msg">No entries added yet today.</div>';
        return;
    }
    let html = '<table style="width:100%"><thead><tr><th class="sr-col">Sr.</th><th>Task</th><th>Hours</th><th>Remarks</th><th>Del</th></tr></thead><tbody>';
    todayEntries.forEach((e, i) => {
        html += `<tr><td style="text-align:center">${i+1}</td><td>${e.task}</td><td>${e.hours}</td><td>${e.remarks}</td><td><button class="btn-delete-row" onclick="deleteEntry(${e.id})">✕</button></td></tr>`;
    });
    html += '</tbody></table>';
    const totalHrs = todayEntries.reduce((s,e) => s + parseFloat(e.hours||0), 0);
    html += `<div style="margin-top:8px;font-size:0.85em">Today's Total: <span style="color:#00d4ff;font-weight:600">${totalHrs} hrs</span> | Entries: <span style="color:#00d4ff;font-weight:600">${todayEntries.length}</span></div>`;
    div.innerHTML = html;
}

function renderTable() {
    const filterDate = document.getElementById('filterDate').value;
    const filterTask = document.getElementById('filterTask').value.toLowerCase();
    
    let filtered = entries;
    if(filterDate) filtered = filtered.filter(e => e.startDate === filterDate);
    if(filterTask) filtered = filtered.filter(e => e.task.toLowerCase().includes(filterTask));

    const tbody = document.getElementById('tableBody');
    const emptyMsg = document.getElementById('emptyTable');

    if(filtered.length === 0) {
        tbody.innerHTML = '';
        emptyMsg.style.display = 'block';
    } else {
        emptyMsg.style.display = 'none';
        tbody.innerHTML = filtered.map((e, i) => `
            <tr>
                <td class="sr-col">${i+1}</td>
                <td>${e.project}</td>
                <td>${e.resource}</td>
                <td>${e.task}</td>
                <td>${formatDate(e.startDate)}</td>
                <td>${formatDate(e.endDate)}</td>
                <td>${e.hours}</td>
                <td>${e.remarks}</td>
                <td><button class="btn-delete-row" onclick="deleteEntry(${e.id})">✕</button></td>
            </tr>
        `).join('');
    }

    // Stats
    const totalHrs = filtered.reduce((s,e) => s + parseFloat(e.hours||0), 0);
    document.getElementById('statEntries').textContent = filtered.length;
    document.getElementById('statHours').textContent = totalHrs;
}

function clearFilter() {
    document.getElementById('filterDate').value = '';
    document.getElementById('filterTask').value = '';
    renderTable();
}

function copyAsExcel() {
    const filterDate = document.getElementById('filterDate').value;
    const filterTask = document.getElementById('filterTask').value.toLowerCase();
    let filtered = entries;
    if(filterDate) filtered = filtered.filter(e => e.startDate === filterDate);
    if(filterTask) filtered = filtered.filter(e => e.task.toLowerCase().includes(filterTask));

    if(filtered.length === 0) { alert('No entries to copy!'); return; }

    let text = '';
    filtered.forEach(e => {
        text += `${e.project}\t${e.resource}\t${e.task}\t${formatDate(e.startDate)}\t${formatDate(e.endDate)}\t${e.hours}\t${e.remarks}\n`;
    });
    navigator.clipboard.writeText(text).then(() => alert('✅ Copied! Paste directly in Excel Sheet2.'));
}

function toggleTeams() {
    const box = document.getElementById('teamsBox');
    if(box.style.display === 'block') { box.style.display = 'none'; return; }

    const filterDate = document.getElementById('filterDate').value || today;
    let filtered = entries.filter(e => e.startDate === filterDate);

    if(filtered.length === 0) { 
        box.textContent = 'No entries for selected date.';
        box.style.display = 'block';
        return;
    }

    const resource = filtered[0].resource;
    const project = filtered[0].project;
    let msg = `📋 Daily Status - ${formatDate(filterDate)}\n`;
    msg += `━━━━━━━━━━━━━━━━━━━━━━━━\n`;
    msg += `Project: ${project}\nResource: ${resource}\n\n`;
    msg += `✅ Tasks:\n`;
    filtered.forEach((e, i) => {
        msg += `${i+1}. ${e.task} (${e.hours} hrs)`;
        if(e.remarks) msg += ` - ${e.remarks}`;
        msg += `\n`;
    });
    const totalHrs = filtered.reduce((s,e) => s + parseFloat(e.hours||0), 0);
    msg += `\nTotal Hours: ${totalHrs}`;

    box.textContent = msg;
    box.style.display = 'block';
}

function exportExcel() {
    if(entries.length === 0) { alert('No entries to export!'); return; }
    let csv = 'Project Name,Resource Name,Task Name,Start Date,End Date,Daily Working Hours,Remarks\n';
    entries.forEach(e => {
        csv += `"${e.project}","${e.resource}","${e.task}","${formatDate(e.startDate)}","${formatDate(e.endDate)}","${e.hours}","${e.remarks}"\n`;
    });
    const blob = new Blob([csv], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `Timesheet_${entries[0].resource.replace(/\s+/g,'_')}_${today}.csv`;
    a.click();
}

function clearAll() {
    if(confirm('⚠️ Are you sure? This will delete ALL entries!')) {
        entries = [];
        saveEntries();
        renderRecent();
        renderTable();
    }
}
</script>
</body>
</html>
